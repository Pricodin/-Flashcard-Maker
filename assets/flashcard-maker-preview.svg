  </defs>

  <rect width="1200" height="700" rx="30" fill="url(#bg)"/>

  <circle cx="1040" cy="120" r="130" fill="#A78BFA" fill-opacity="0.12"/>
  <circle cx="200" cy="640" r="180" fill="#34D399" fill-opacity="0.08"/>

  <rect x="90" y="110" width="1020" height="510" rx="26" fill="#111827" fill-opacity="0.52" stroke="#334155"/>

  <rect x="150" y="165" width="540" height="380" rx="18" fill="url(#card)"/>
  <rect x="150" y="165" width="540" height="64" rx="18" fill="#F8FAFC"/>
  <text x="178" y="206" fill="#0F172A" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Flashcard Maker</text>

  <rect x="178" y="250" width="484" height="126" rx="14" fill="#E2E8F0"/>
  <text x="196" y="292" fill="#475569" font-size="20" font-family="Segoe UI, Arial, sans-serif">Topic or term pairs</text>
